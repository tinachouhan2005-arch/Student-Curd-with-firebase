<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Curd with firebase and XHR</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
       
    <div class="container-fluid p-5">
        <div class="row">
            <div class="col-4">
                <div class="card">
                    <div class="card-header tablecol"><strong>Admission Form</strong></div>
                    <div class="card-body tablerow">
                        <form id="stdForm">
                            <div class="form-group">
                                <label class="fname"><b>First Name</b></label>
                                <input type="text" class="form-control" required id="fname">
                            </div>
                            <div class="form-group">
                                <label class="lname"><b>Last Name</b></label>
                                <input type="text" class="form-control" required id="lname">
                            </div>
                            <div class="form-group">
                                <label for="email"><b>E-Mail</b></label>
                                <input type="text" class="form-control" required id="email">
                            </div>
                            <div class="form-group">
                                <label for="contact"><b>Contact</b></label>
                                <input type="number" class="form-control" required id="contact">
                            </div>
                            <div class="card-footer tablecol">
                                <button class="btn btn-sm btn-block btn-primary" type="submit" id="addstdBtn">Add Student</button>
                                <button class="btn btn-sm btn-block btn-success d-none" type="button" id="updatestdBtn">Update Student</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-7 offset-1">
                <div class="card">
                    <div class="card-body table-responsive">
                        
                        <table class="table table-bordered table-hover">
                            <thead class="tablecol">
                                <tr>
                                    <th>Sr.No</th>
                                    <th>First Name</th>
                                    <th>Last Name</th>
                                    <th>E-Mail</th>
                                    <th>Contact</th>
                                    <th>Edit</th>
                                    <th>Remove</th>
                                </tr>
                            </thead>
                            <tbody class="tablerow" id="stdContainer">
                                <!-- <tr>
                                    <td>1</td>
                                    <td>Johan</td>
                                    <td>Deo</td>
                                    <td>jhoan@gmail.com</td>
                                    <td>5389129156</td>
                                    <td><button class="btn btn-sm btn-outline-primary" type="button">Edit</button></td>
                                    <td><button class="btn btn-sm btn-outline-danger" type="button">Remove</button></td>
                                </tr> -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="spinner d-none" id="spinner">
        <div class="spinner-border text-primary" role="status">
  <span class="sr-only">Loading...</span>
</div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>
</html>
